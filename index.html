<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hyderabad Street Racer</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font:16px system-ui;text-align:center}main{max-width:440px;margin:auto;padding:12px}canvas{width:100%;max-height:65vh;object-fit:contain;background:#334155;border-radius:12px;touch-action:none}button{border:0;border-radius:10px;padding:16px;color:white;background:#334155;font:bold 18px system-ui;touch-action:none;cursor:pointer}.controls{display:flex;gap:8px}.controls button{flex:1}#start{width:100%;background:#15803d;margin-top:8px}h2{margin:5px}small{color:#b8c5d8}</style><main><h2>🏁 Hyderabad Street Racer</h2><canvas id="c" width="360" height="460"></canvas><div class="controls"><button id="l">◀</button><button id="n" style="background:#b45309">⚡ Nitro</button><button id="r">▶</button></div><button id="start">START RACE</button><p><small>Tap arrows to steer • Hold Nitro to boost • Avoid traffic</small></p></main><script>
const c=document.querySelector('#c'),g=c.getContext('2d'),xs=[104,180,256],zones=['Charminar','Hussain Sagar','HITEC City','Outer Ring Road'];let run=false,over=false,lane=1,x=180,d=0,coins=0,score=0,best=0,nitro=100,boost=false,obs=[],spawn=0,last=0;try{best=+localStorage.hydBest||0}catch(e){}function box(x,y,w,h,k){g.fillStyle=k;g.fillRect(x,y,w,h)}function txt(s,x,y,z=14,k='white'){g.fillStyle=k;g.font='bold '+z+'px system-ui';g.textAlign='center';g.fillText(s,x,y)}function car(x,y,k,a){box(x-22,y-23,44,49,'#111');g.fillStyle=k;g.beginPath();g.roundRect(x-18,y-33,36,66,8);g.fill();box(x-13,y-19,26,15,'#a5d8ed');box(x-13,y+12,26,12,'#263c51');if(a)box(x-18,y-6,36,20,'#222');box(x-14,y-29,8,4,'#fff');box(x+6,y-29,8,4,'#fff')}
function landmark(z,x,y){if(z===0){box(x-19,y+15,38,53,'#d6b28a');for(let i of [-22,22]){box(x+i-5,y-10,10,80,'#e6c49a');g.fillStyle='#e6c49a';g.beginPath();g.arc(x+i,y-10,7,Math.PI,0);g.fill()}box(x-9,y+42,18,26,'#614936')}else if(z===1){box(x-25,y,50,80,'#367d9e');box(x-15,y+65,30,8,'#ccc');box(x-6,y+22,12,43,'#ddd');g.fillStyle='#ddd';g.beginPath();g.arc(x,y+15,7,0,7);g.fill()}else if(z===2){box(x-23,y,46,90,'#527d99');for(let i=0;i<5;i++)for(let j=0;j<3;j++)box(x-19+j*14,y+8+i*16,9,10,'#a8d5e8')}else{box(x-2,y,4,80,'#ddd');box(x-26,y,52,25,'#166534');txt('ORR',x,y+17,12)}}
function draw(){let z=Math.floor(d/650)%4;box(0,0,360,460,z===1?'#367d9e':'#52754b');for(let i=0;i<6;i++)for(let a of [8,314])box(a,(i*100+d*2)%600-100,38,55,'#87999b');landmark(z,29,110);landmark(z,331,280);box(58,0,244,460,'#888');box(64,0,232,460,'#343a42');for(let a of [66,294])box(a,0,3,460,'#fff');for(let y=-60;y<460;y+=60)for(let a of [140,217])box(a,y+d*3%60,3,30,'#ddd');for(let o of obs){if(o.coin){g.fillStyle='#facc15';g.beginPath();g.arc(xs[o.l],o.y,11,0,7);g.fill();txt('₹',xs[o.l],o.y+5,14,'#92400e')}else car(xs[o.l],o.y,o.k,o.a)}if(boost&&run&&nitro>0)box(x-9,390,18,18,'#38bdf8');car(x,360,'#ef4444');box(0,0,360,68,'#101827');txt(zones[z],180,20,18);txt('Score '+score,55,43,12);txt('Best '+best,180,43,12);txt('Coins '+coins,305,43,12,'#facc15');box(10,54,340,5,'#475569');box(10,54,340*nitro/100,5,'#38bdf8');if(!run){box(0,120,360,205,'#101827');txt(over?'RACE OVER':'HYDERABAD',180,173,30,'#facc15');txt(over?'Score: '+score:'STREET RACER',180,209,23);txt(over?'Coins: '+coins:'Dodge cars and autos',180,247);txt(over?'Tap restart to try again':'Four iconic city locations',180,277,12)}}
function tick(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(run){let fast=boost&&nitro>0,s=(3.1+Math.min(d/850,3)+(fast?3.8:0))*dt;d+=s*.28;score=Math.floor(d)+coins*50;nitro=Math.max(0,Math.min(100,nitro+(fast?-.65:.12)*dt));x+=(xs[lane]-x)*Math.min(.22*dt,1);spawn+=s;if(spawn>115){spawn=0;let q=Math.random();obs.push({l:Math.floor(Math.random()*3),y:-40,coin:q<.3,a:q>=.3&&q<.55,k:q<.55?'#eab308':'#60a5fa'})}for(let o of obs){o.y+=s;if(!o.hit&&Math.abs(xs[o.l]-x)<33&&Math.abs(o.y-360)<(o.coin?38:53)){o.hit=true;if(o.coin){coins++;nitro=Math.min(100,nitro+12)}else{run=false;over=true;best=Math.max(best,score);try{localStorage.hydBest=best}catch(e){}document.querySelector('#start').textContent='RESTART RACE';break}}}obs=obs.filter(o=>o.y<510&&!(o.hit&&o.coin))}draw();requestAnimationFrame(tick)}function move(v){if(run)lane=Math.max(0,Math.min(2,lane+v))}document.querySelector('#start').onclick=()=>{run=true;over=false;lane=1;x=180;d=coins=score=spawn=0;nitro=100;obs=[];boost=false;document.querySelector('#start').textContent='RESTART RACE'};document.querySelector('#l').onpointerdown=()=>move(-1);document.querySelector('#r').onpointerdown=()=>move(1);let b=document.querySelector('#n');b.onpointerdown=e=>{boost=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>boost=false;window.onkeydown=e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' ')boost=true}};window.onkeyup=e=>{if(e.key===' ')boost=false};requestAnimationFrame(tick);
</script></html>
